name: CI

on:
  push:
    branches:
      - development
      - feature/**
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run automated test suite
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_environment_devact
          SESSION_SECRET: test_session_secret_for_ci_environment_devact
          ENCRYPTION_KEY: 12345678901234567890123456789012
          FRONTEND_URL: http://localhost:5173
          CRON_SECRET: test_cron_secret_for_ci_environment_devact
          MONGO_URI: mongodb://localhost:27017/test_devact

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install client dependencies
        working-directory: client
        run: npm ci || npm install

      - name: Build frontend
        working-directory: client
        run: npm run build
